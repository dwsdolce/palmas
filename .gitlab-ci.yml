stages:
  - build

variables:
  YARN: "yarn --cache-folder /tmp/yarn-cache"
  DEBIAN_FRONTEND: "noninteractive"
  ANDROID_SDK_ROOT: "/usr/lib/android-sdk"
  ANDROID_HOME: "/usr/lib/android-sdk"
  ANDROID_SDK_HOME: "/root"
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

# Jobs

test_web_job:
  script:
    - ln -fs /usr/share/zoneinfo/Europe/Paris /etc/localtime
    - apt-get -y -qq update
    - apt-get -y -qq dist-upgrade
    - apt-get -y -qq install curl gnupg
    # Node 24 LTS, matching .nvmrc. @quasar/app-vite v3 declares
    # node ^30 || ^28 || ^26 || ^24 || ^22.22.0 and yarn enforces engines,
    # so the older Node 20 makes `yarn install` refuse to run at all.
    - curl -fsSL https://deb.nodesource.com/setup_24.x -o /tmp/nodesource_setup.sh
    - bash /tmp/nodesource_setup.sh
    - apt-get -y -qq update
    # xvfb, libgtk-3-dev, libnotify-dev, libnss3 and libxss1 used to be here
    # for Cypress; those tests were removed in b9f948f (2022) and nothing has
    # needed a display server since. ffmpeg is the one real prerequisite: the
    # audio is generated from the committed .wav masters.
    - apt-get install -y -qq nodejs git make g++ gcc rsync ffmpeg
    # Update npm (more up to date than the one from the nodejs deb package)
    - npm install -g npm
    # Icons and audio are generated by the postinstall hook; the Quasar CLI and
    # Icon Genie are project dependencies, so nothing needs installing globally.
    - corepack enable
    - $YARN install
    # Build the web app. `yarn build` rather than `npx quasar build`: the mode
    # lives in package.json, and naming it twice is how this drifted before.
    - yarn build
    - (cd dist && tar cvzf pwa.tar.gz pwa)
    # Install openjdk 17
    - apt -y -qq install openjdk-17-jdk openjdk-17-jre
    # Install required apt-utils package (to avoid 'debconf: delaying package configuration, since apt-utils is not installed' while installing android packages from google)
    - apt -y -qq install apt-utils
    # Install android packages from google
    - apt -y -qq install google-android-cmdline-tools-13.0-installer google-android-build-tools-30.0.3-installer google-android-build-tools-34.0.0-installer google-android-licenses google-android-tools-installer google-android-platform-tools-installer google-android-platform-33-installer google-android-platform-34-installer
    - (cd src-capacitor && $YARN install)
    - ((yes | sdkmanager --licenses) || exit 0)
    - sdkmanager --update
    - npx quasar build -m capacitor -T android

  stage: build
  tags:
    - amd64
  image: ubuntu:noble
  artifacts:
    paths:
      - dist/capacitor/android/apk/release/app-release-unsigned.apk
      - dist/pwa.tar.gz
    expire_in: 6 mos
#  artifacts:
#    paths:
#      - test/cypress/screenshots
#      - test/cypress/videos
#    expire_in: 6 mos
