import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Load keystore properties
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// versionName is the marketing version, from the root package.json.
def packageJson = new JsonSlurper().parseText(rootProject.file("../../package.json").text)
def appVersion = packageJson.version.toString()                      // e.g. "1.0.0"

// versionCode is the git commit count, as every project here derives its build
// number - guitar_tap, GuitarTap, GuitarTapWeb, pdfarranger and marklens-ports
// all use `git rev-list --count HEAD`. It increases with every commit, which is
// exactly what Play requires, and it names the commit a build came from.
//
// It replaces a formula carried over from A Compás, which offset the semver by
// 701000000 to stay above that project's last published code. Palmas publishes
// under its own applicationId and shares none of that history, so the offset
// only tied this app to someone else's release numbering. The formula also gave
// every build of one version the same code, so two builds of 4.2.5 were
// indistinguishable; a commit count is different for each.
//
// No fallback on purpose. The web build falls back to 0 because the number is
// only displayed there, but a wrong versionCode is a store problem: a shallow
// clone yields 1, Play accepts it, and every later upload is then refused as
// not higher. Failing here is far cheaper than finding out at upload.
// providers.exec rather than the project-level exec(Closure): that form is
// deprecated in Gradle 8 and gone in 9, and this file is already carrying
// warnings it cannot fix from its dependencies without adding one it can.
def gitProcess = providers.exec {
    commandLine 'git', 'rev-list', '--count', 'HEAD'
    workingDir = rootProject.file("../..")
    ignoreExitValue = true
}
def gitExit = gitProcess.result.get().exitValue
def gitCount = gitProcess.standardOutput.asText.get().trim()
def computedVersionCode = gitCount.isInteger() ? gitCount.toInteger() : -1
if (gitExit != 0 || computedVersionCode < 2) {
    throw new GradleException(
        "Cannot determine the build number: 'git rev-list --count HEAD' gave " +
        "'${gitCount}'. The Android versionCode is the commit " +
        "count, so this needs a full git checkout - a shallow clone (git clone " +
        "--depth, or actions/checkout without fetch-depth: 0) reports 1.")
}

// Properties are assigned with '=' rather than the space-separated form
// Capacitor scaffolds. Gradle 8 deprecates that form and Gradle 9 removes it;
// only the four lines Gradle actually flagged are changed, because the other
// space-separated calls here are DSL methods rather than property assignments.
// The remaining warnings in a build come from the @capacitor packages
// themselves and from the generated cordova-plugins module, neither of which
// is editable from here.
android {
    namespace = "com.dolcesfogato.palmas"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dolcesfogato.palmas"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Only sign when there is something to sign with. Assigning the
            // config unconditionally meant a release build without
            // keystore.properties failed at :app:packageRelease with
            // "SigningConfig 'release' is missing required property
            // 'storeFile'" - and the documentation said it would produce an
            // unsigned APK instead. Omitting the config is what actually does
            // that, so anyone can build a release APK to test with, and only
            // the person holding the keystore can sign one.
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Gradle names an APK after its module and build type - app-release.apk -
    // which says nothing about what it is, and is the same name for every
    // version ever built. The desktop builds carry product, version and
    // architecture in the filename because quasar.config.js gives
    // electron-builder an artifactName template; this is the Android
    // equivalent, and it is the difference between finding a release artifact
    // and hunting for it.
    //
    // Deliberately no architecture: this APK carries no native libraries, so
    // one file serves every device.
    //
    // `applicationVariants` is the older variant API. AGP 8.11 accepts it
    // without complaint - `--warning-mode all` names only the generated
    // capacitor-cordova-android-plugins file, never this one - but it is on
    // its way out, and its replacement, `androidComponents`, offers no way to
    // rename an APK at all. So this is still how it is done, and the day it
    // stops working the fix is the same copy step the bundle already needs
    // below.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "palmas-${variant.versionName}.${variant.versionCode}.apk"
        }
    }
}

// The bundle, which the block above cannot reach: `outputs` covers APKs only,
// so `bundleRelease` writes app-release.aab and neither variant API offers a
// hook to change that.
//
// Copied rather than renamed, and that is not fastidiousness. Renaming it
// makes the *next* build fail outright: AGP's own
// produceReleaseBundleIdeListingFile declares app-release.aab as an input, and
// reports "property 'finalBundleFile' specifies file ... which doesn't exist".
// So AGP's file stays where AGP wants it, and the copy beside it is the one to
// upload. Quasar copies the whole outputs/ tree, so both travel into dist/.
tasks.matching { it.name ==~ /^bundle(Debug|Release)$/ }.configureEach { bundleTask ->
    bundleTask.doLast {
        def buildType = bundleTask.name == 'bundleRelease' ? 'release' : 'debug'
        def dir = layout.buildDirectory.dir("outputs/bundle/${buildType}").get().asFile
        def written = new File(dir, "app-${buildType}.aab")
        if (written.exists()) {
            def named = new File(dir, "palmas-${appVersion}.${computedVersionCode}.aab")
            java.nio.file.Files.copy(
                written.toPath(), named.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
