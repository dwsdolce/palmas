name: Web build

on:
  push:
    branches: [ develop, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Full history, not the default shallow clone. The build number is the
      # git commit count, and `git rev-list --count HEAD` returns 1 at
      # fetch-depth 1 - so every CI build would call itself build 1, including
      # the SPA uploaded as an artifact.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      # Only the .wav masters are committed; every playable format is
      # generated. 321 files x 4 formats is minutes of ffmpeg, so it is cached
      # against the masters and the converter script.
      - name: Cache generated audio
        id: audio-cache
        uses: actions/cache@v6
        with:
          path: public/audio
          key: audio-${{ hashFiles('public/audio/**/*.wav', 'scripts/format-audio.mjs') }}

      - name: Generate audio
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          node scripts/format-audio.mjs convert

      # yarn install downloads the ~100MB Electron binary through electron's
      # own postinstall, into a cache directory of its own. Keyed on the
      # version so a bump fetches the new one.
      - name: Cache the Electron binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      # The web specs drive a real Chromium. The Electron ones do not need it -
      # they launch the app's own binary - so this is the only browser fetched.
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      # src-capacitor has its own package.json and lockfile. Even the plain SPA
      # build needs it: the Capacitor imports in src/boot/statusbar.ts,
      # src/composables/keep-awake.ts and src/App.vue resolve into
      # src-capacitor/node_modules, and the build fails with
      # UNLOADABLE_DEPENDENCY without it.
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile
          (cd src-capacitor && yarn install --frozen-lockfile)

      - name: Lint
        run: npx eslint --ext .js,.ts,.vue ./src ./test

      - name: Test
        run: yarn test

      - name: Build
        run: npx quasar build

      # A build that succeeds is not evidence the app runs: import.meta.globEager
      # survived the v2 upgrade's build and left a blank page. This catches that
      # class of failure — a bundle that compiles but throws on load, or a file
      # that was never committed. It does NOT catch everything: when the i18n
      # plugin was misconfigured the app still mounted and only the translated
      # controls vanished, which these assertions would have passed.
      - name: Smoke test
        run: |
          node scripts/serve-static.mjs 4173 --directory dist/pwa &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done

          google-chrome --headless --no-sandbox --disable-gpu \
            --virtual-time-budget=15000 --enable-logging=stderr --log-level=0 \
            --dump-dom http://127.0.0.1:4173/ > dom.html 2> chrome.log || true

          echo "DOM size: $(wc -c < dom.html) bytes"

          if ! grep -q 'id="q-app"' dom.html; then
            echo "::error::#q-app not found - the app did not mount"
            exit 1
          fi

          if ! grep -q 'class="q-layout' dom.html; then
            echo "::error::no Quasar layout rendered - the app mounted but produced nothing"
            exit 1
          fi

          if grep -qE 'CONSOLE.*(Uncaught|TypeError|ReferenceError|SyntaxError)' chrome.log; then
            echo "::error::JavaScript errors on load:"
            grep -E 'CONSOLE.*(Uncaught|TypeError|ReferenceError|SyntaxError)' chrome.log
            exit 1
          fi

          echo "App mounted and rendered with no console errors."

      # The desktop app, built and actually launched. Two of the bugs that
      # reached a device this month - a blank window, and marks drawn in a
      # colour that could not be seen - compiled cleanly and passed every unit
      # test. Opening the window is the only check that would have caught the
      # first of them.
      #
      # -s stops after the unpackaged folder, which is what the tests launch:
      # building the installers as well costs half a minute and 800MB to
      # produce something nothing here opens.
      - name: Build the desktop app
        run: npx quasar build -m electron -s

      # Electron needs a display, and a runner has none. The web specs run in
      # the same command: they cover the help control, which is a pointer and
      # touch interaction against a real renderer that no unit test can reach.
      # They serve dist/pwa themselves, so the PWA build above is their input.
      - name: Test the desktop and web apps
        run: |
          npx playwright install chromium
          xvfb-run -a npx playwright test

      - name: Package the SPA
        run: tar -czf spa.tar.gz -C dist spa

      - uses: actions/upload-artifact@v7
        with:
          name: spa
          path: spa.tar.gz
          retention-days: 30
